name: Feature Request
description: 建议新的检测规则、输出能力或工程改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        LogHawk 坚持轻量、离线、零运行时依赖。提出建议时请说明使用场景与收益，
        避免仅增加复杂度而无明确安全价值的改动。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前遇到了什么限制？谁会遇到？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的行为、输入输出与边界条件。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过用现有参数、脚本或外部工具解决？
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 该建议可仅用 Python 标准库实现
          required: true
        - label: 该建议不引入网络请求、遥测或破坏性操作
          required: true
