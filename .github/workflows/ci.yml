name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile sources
        run: python -m compileall -q loghawk tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test CLI
        run: python -m loghawk demo/auth.log --fail-on never

      - name: Smoke test non-UTF8 console fallback
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = "0"
          $env:PYTHONIOENCODING = "cp1252"
          python -m loghawk demo/auth.log --fail-on never
