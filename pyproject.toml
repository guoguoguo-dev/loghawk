[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loghawk"
version = "0.1.0"
description = "Lightweight, offline SSH authentication log threat analyzer"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "guoguoguo-dev", email = "256551196+guoguoguo-dev@users.noreply.github.com" }]
keywords = ["security", "ssh", "log-analysis", "incident-response", "dfir"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/guoguoguo-dev/loghawk"
Repository = "https://github.com/guoguoguo-dev/loghawk"
Issues = "https://github.com/guoguoguo-dev/loghawk/issues"
Changelog = "https://github.com/guoguoguo-dev/loghawk/blob/main/CHANGELOG.md"

[project.scripts]
loghawk = "loghawk.cli:entrypoint"

[tool.setuptools]
packages = ["loghawk"]
